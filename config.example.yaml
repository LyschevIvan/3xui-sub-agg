listen: ":8080"
# Публичный URL (за reverse proxy). Используется для ссылок-приглашений и подписок.
# Если пусто — берётся из Host заголовка запроса.
public_url: "http://localhost:8080"

# Только Secure cookies (прод за HTTPS). Для локальной разработки выставить в false.
cookies_secure: true

# Интервал опроса 3x-ui панелей.
refresh_interval: "1m"
request_timeout: "10s"

# Путь к SQLite базе. Каталог создаётся автоматически.
# Для Docker используйте абсолютный путь внутри volume, напр. /app/data/data.db.
db_path: "./data/data.db"

# Bootstrap-админ. Создаётся при первом запуске, если такого логина ещё нет в БД.
# Если пользователь существует — ничего не трогаем.
admin:
  login: "admin"
  password: "${ADMIN_PASSWORD}"

# Ключ для шифрования паролей 3x-ui в БД (AES-256-GCM). Если пустой — пароли
# хранятся plaintext (как было раньше, обратная совместимость). При первом
# старте с заданным master_key все существующие plaintext пароли будут
# зашифрованы автоматически. ВАЖНО: потеряете ключ — потеряете доступ к
# сохранённым паролям; восстановление = пересохранить серверы вручную.
master_key: "${XUISUBAGG_MASTER_KEY}"
