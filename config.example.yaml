listen: ":8080"
# Публичный URL (за reverse proxy). Используется для ссылок-приглашений и подписок.
# Если пусто — берётся из Host заголовка запроса.
public_url: "http://localhost:8080"

# Только Secure cookies (прод за HTTPS). Для локальной разработки выставить в false.
cookies_secure: true

# Интервал опроса 3x-ui панелей.
refresh_interval: "1m"
request_timeout: "10s"

# Путь к SQLite базе. Каталог создаётся автоматически.
# Для Docker используйте абсолютный путь внутри volume, напр. /app/data/data.db.
db_path: "./data/data.db"

# Bootstrap-админ этого приложения (не учётная запись панели 3x-ui). Создаётся
# при первом запуске; существующий пользователь не изменяется.
admin:
  login: "admin"
  password: "${ADMIN_PASSWORD}"

# Ключ для шифрования API-токенов 3x-ui в БД (AES-256-GCM). Обязателен для
# сохранения/замены токенов и должен иметь отдельную защищённую резервную копию.
# Без ключа сервис запускается, а панели остаются видимыми, но токены сохранить
# нельзя. При утрате ключа все ранее сохранённые токены нужно заменить.
master_key: "${XUISUBAGG_MASTER_KEY}"
