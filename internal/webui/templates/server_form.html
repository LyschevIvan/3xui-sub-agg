{{define "content"}}
<h1>{{if .Form.ID}}Сервер: {{.Form.Name}}{{else}}Новый сервер{{end}}</h1>
<p><a href="/dashboard">← К списку</a></p>

<div class="card">
  <form method="post" action="{{if .Form.ID}}/dashboard/servers/{{.Form.ID}}{{else}}/dashboard/servers/new{{end}}">
    <label>Имя (попадает в remark ссылки)</label>
    <input type="text" name="name" required value="{{.Form.Name}}" placeholder="DE-1">

    <label>API URL панели 3x-ui</label>
    <input type="url" name="api_url" required value="{{.Form.APIURL}}" placeholder="http://1.2.3.4:54321">

    <label>webBasePath (с / с обеих сторон)</label>
    <input type="text" name="path" value="{{.Form.Path}}" placeholder="/admin/">

    <div class="row">
      <div>
        <label>Логин админа</label>
        <input type="text" name="username" required value="{{.Form.Username}}">
      </div>
      <div>
        <label>Пароль {{if .Form.ID}}(оставьте пустым, чтобы не менять){{end}}</label>
        <input type="password" name="password" {{if not .Form.ID}}required{{end}}>
      </div>
    </div>

    <label>Публичный хост для vless:// (если отличается от api_url)</label>
    <input type="text" name="host_override" value="{{.Form.HostOverride}}" placeholder="de1.example.com">

    <label style="display:flex; align-items:center; gap:6px; margin-top:16px;">
      <input type="checkbox" name="insecure_skip_verify" value="1" {{if .Form.InsecureSkipVerify}}checked{{end}}>
      Игнорировать самоподписанный TLS сертификат
    </label>

    <div class="form-actions">
      <button type="submit">Сохранить</button>
      <a class="btn secondary" href="/dashboard">Отмена</a>
    </div>
  </form>
</div>

{{if .Form.ID}}
<div class="card">
  <h3>Удалить сервер</h3>
  <p class="muted">Подписки клиентов с этого сервера исчезнут после следующего обновления.</p>
  <form method="post" action="/dashboard/servers/{{.Form.ID}}/delete" onsubmit="return confirm('Удалить сервер {{.Form.Name}}?');">
    <button class="danger" type="submit">Удалить</button>
  </form>
</div>
{{end}}
{{end}}
{{template "base" .}}
